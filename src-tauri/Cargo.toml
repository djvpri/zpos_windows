[package]
name = "zpos-kasir"
version = "0.1.111"
description = "Z1 Kasir — cashier desktop offline-first (Tauri + SQLite)"
edition = "2021"

[lib]
name = "zpos_kasir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
bcrypt = "0.15"
opener = "0.7"
rfd = "0.15"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Cetak nota langsung ke printer thermal via Windows Print Spooler (winspool).
# Target-specific: hanya di-load saat build Windows — Linux/macOS tak terpengaruh.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 2
lto = true
