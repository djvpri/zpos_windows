name: Rust Build (ZPos Kasir)

on:
  push:
    branches: [main]
    paths: ['src-tauri/**', 'src/**', '.github/workflows/rust-build.yml']
  pull_request:
    paths: ['src-tauri/**', 'src/**']
  workflow_dispatch:

jobs:
  build:
    name: tauri build (bundle windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check
        run: cargo check --release

      - name: Build & bundle installer (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tauri-action default = 'tauri build' (bundle.targets all -> NSIS+MSI)

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: zpos-kasir-windows
          path: src-tauri/target/release/bundle/*/*
          if-no-files-found: error
