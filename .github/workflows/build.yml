name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build .exe (release)
        working-directory: src-tauri
        # --no-bundle: hasilkan biner .exe portable langsung (skip MSI/NSIS
        # bundler yang butuh toolchain WiX/NSIS — sering gagal di runner Windows).
        # `ponytail:` installer (MSI/NSIS) = beri `bundle.targets` wix/nsis utk Tauri
        # di masa mendatang setelah webview biner terverifikasi.
        run: cargo tauri build --no-bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zpos-kasir-windows-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
