name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install NSIS (bundler butuh makensis)
        shell: bash
        run: |
          choco install nsis -y --no-progress || true

      - name: Build (release + NSIS installer)
        working-directory: src-tauri
        # Bundle NSIS installer (`bundle.targets=["nsis"]` di tauri.conf.json).
        # Hasil: target/release/zpos-kasir.exe (portable) + bundle/nsis/*-setup.exe.
        # `.sig` & `latest.json` tak dihasilkan di CI — signature dibuat saat
        # rilis manual (private key lokal, tak tersimpan di CI). Better keamanan.
        run: cargo tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: zpos-kasir-windows-exe
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
