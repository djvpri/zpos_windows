[package]
name = "zpos-kasir-check"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

# (reqwest/sync diuji terpisah karena butuh network; validasi inti = db.)

[[bin]]
name = "zpos-kasir-check"
path = "src/main.rs"
